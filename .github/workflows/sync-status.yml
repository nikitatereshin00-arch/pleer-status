name: Sync status and latest

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier
        run: pip install cryptography
      - name: Pull from Telegraph
        run: python3 .github/scripts/sync_from_telegraph.py
      - name: Commit if changed
        run: |
          git config user.name "pleer-status-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json latest.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Sync signed status.json and latest.json"
            git push
          fi
